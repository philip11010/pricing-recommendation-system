[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pep8-naming]
# scikit-learn convention: X is the feature matrix
extend-ignore-names = ["X", "X_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tests that cannot run without the prepared models in app_assets/, which
# are a local build output and are not in the repository. They skip
# themselves when the folder is absent, so CI stays green without them.
markers = [
    "app_assets: needs the prepared models in app_assets/ (run scripts/prepare_app_assets.py)",
    "dataset: needs the processed dataset in data/processed/ (built by notebooks/03_build_master_dataset.ipynb)",
]
